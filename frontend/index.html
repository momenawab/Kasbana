<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E1B2A" />

    <!-- Default SEO fallback (per-route/-language values are set with react-helmet-async).
         English lives at "/", Arabic at "/ar". -->
    <title>Kasbana — Digital loyalty cards in your customers' wallet</title>
    <meta
      name="description"
      content="Kasbana (كسبانة) is a digital loyalty and rewards platform for cafés, restaurants, salons, gyms, and shops. Customers add stamp and points cards to Apple Wallet and Google Wallet — no app needed. Built for Egypt, Arabic-first."
    />

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kasbana" />
    <meta property="og:title" content="Kasbana — Digital loyalty cards in your customers' wallet" />
    <meta
      property="og:description"
      content="Digital loyalty cards that live in your customers' phone wallet — no app needed."
    />
    <meta property="og:url" content="https://kasbana.net" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Space Grotesk (headings), Inter (body), Cairo (Arabic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
