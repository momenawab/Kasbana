<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon / tab + Google icon: the Stampn card mark. SVG for modern
         browsers, PNG fallback + Apple touch icon for the rest. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090B" />

    <!-- Default SEO fallback (per-route/-language values are set with react-helmet-async).
         English lives at "/", Arabic at "/ar". -->
    <title>Stampn — Digital loyalty cards in your customers' wallet</title>
    <meta
      name="description"
      content="Stampn (Stampn) is a digital loyalty and rewards platform for cafés, restaurants, salons, gyms, and shops. Customers add stamp and points cards to Apple Wallet and Google Wallet — no app needed. Built for Egypt, Arabic-first."
    />

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stampn" />
    <meta property="og:title" content="Stampn — Digital loyalty cards in your customers' wallet" />
    <meta
      property="og:description"
      content="Digital loyalty cards that live in your customers' phone wallet — no app needed."
    />
    <meta property="og:url" content="https://stampn.net" />
    <meta property="og:image" content="https://stampn.net/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://stampn.net/logo.png" />

    <!-- Structured data for Google (Organization + WebSite). Static so it is
         crawlable without JS; per-route title/description/canonical are still
         set client-side with react-helmet-async. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://stampn.net/#organization",
            "name": "Stampn",
            "url": "https://stampn.net/",
            "logo": "https://stampn.net/logo.png",
            "email": "contact@stampn.net",
            "description": "Digital loyalty and rewards platform. Customers add stamp and points cards to Apple Wallet and Google Wallet — no app needed. Built Arabic-first for Egypt.",
            "areaServed": "EG"
          },
          {
            "@type": "WebSite",
            "@id": "https://stampn.net/#website",
            "url": "https://stampn.net/",
            "name": "Stampn",
            "inLanguage": ["en", "ar"],
            "publisher": { "@id": "https://stampn.net/#organization" }
          }
        ]
      }
    </script>

    <!-- Google Fonts: Manrope (Latin UI), Cairo (Arabic), Material Symbols (icons).
         Loaded non-blocking (media="print" swap) so they don't delay first paint.
         The preconnect hints let DNS/TLS finish before the stylesheet request. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
