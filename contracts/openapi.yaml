    patch:
      operationId: patch_settings_account
      tags: [Settings]
      summary: Update account settings
      x-status: dashboard-proposed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountSettings" }
      responses:
        "200":
