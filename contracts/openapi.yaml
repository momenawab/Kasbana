openapi: 3.0.3
info:
  title: Stampn API
  version: 1.2.0
  description: Digital loyalty & wallet-pass platform. Merchant API under `/api/v1`
    and the admin console under `/api/admin/v1`. This document is generated from the
    live code by drf-spectacular — `contracts/openapi.yaml` is the committed snapshot
    and CI fails if it drifts from the served schema.
paths:
  /api/admin/v1/admins:
    get:
      operationId: api_admin_v1_admins_list
      description: GET /admins — list the team. POST /admins — invite a new admin.
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
          description: ''
    post:
      operationId: api_admin_v1_admins_create
      description: GET /admins — list the team. POST /admins — invite a new admin.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminInvite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminInvite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminInvite'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInviteResult'
          description: ''
  /api/admin/v1/admins/{admin_id}:
    patch:
      operationId: api_admin_v1_admins_partial_update
      description: PATCH /admins/{id} — change role and/or active state (guarded +
        audited).
      parameters:
      - in: path
        name: admin_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/admin/v1/admins/{admin_id}/activity:
    get:
      operationId: api_admin_v1_admins_activity_list
      description: GET /admins/{id}/activity — that admin's recent audited actions.
      parameters:
      - in: path
        name: admin_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminActivity'
          description: ''
  /api/admin/v1/admins/{admin_id}/reset-mfa:
    post:
      operationId: api_admin_v1_admins_reset_mfa_create
      description: |-
        POST /admins/{id}/reset-mfa — clear an admin's MFA (Phase 15 recovery).

        The path back when an admin loses their authenticator: a super-admin resets
        it, and the target is forced to re-enrol on their next login (privileged
        roles) or is simply MFA-less again. Also revokes the target's sessions so a
        compromised device can't keep a live token. Super-admin only, audited.
      parameters:
      - in: path
        name: admin_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/admin/v1/analytics/platform:
    get:
      operationId: api_admin_v1_analytics_platform_retrieve
      description: GET /analytics/platform — non-financial usage aggregates (any admin).
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformAnalytics'
          description: ''
  /api/admin/v1/analytics/revenue:
    get:
      operationId: api_admin_v1_analytics_revenue_retrieve
      description: GET /analytics/revenue — Finance/Super-admin only.
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: 'Start date YYYY-MM-DD (default: 12mo ago)'
      - in: query
        name: to
        schema:
          type: string
        description: 'End date YYYY-MM-DD (default: today)'
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueAnalytics'
          description: ''
  /api/admin/v1/analytics/revenue/export:
    get:
      operationId: api_admin_v1_analytics_revenue_export_retrieve
      description: GET /analytics/revenue/export — monthly collected-revenue CSV (Finance).
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Start date YYYY-MM-DD
      - in: query
        name: to
        schema:
          type: string
        description: End date YYYY-MM-DD
      tags:
      - api
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
  /api/admin/v1/announcements:
    get:
      operationId: api_admin_v1_announcements_list
      description: GET /announcements (any admin) · POST create draft (Marketing+).
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Announcement'
          description: ''
    post:
      operationId: api_admin_v1_announcements_create
      description: GET /announcements (any admin) · POST create draft (Marketing+).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnnouncementWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnnouncementWrite'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
  /api/admin/v1/announcements/{announcement_id}:
    get:
      operationId: api_admin_v1_announcements_retrieve
      description: GET (any admin) · PATCH / DELETE (Marketing+, DRAFT/SCHEDULED only).
      parameters:
      - in: path
        name: announcement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
    patch:
      operationId: api_admin_v1_announcements_partial_update
      description: GET (any admin) · PATCH / DELETE (Marketing+, DRAFT/SCHEDULED only).
      parameters:
      - in: path
        name: announcement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncementWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncementWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncementWrite'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
    delete:
      operationId: api_admin_v1_announcements_destroy
      description: GET (any admin) · PATCH / DELETE (Marketing+, DRAFT/SCHEDULED only).
      parameters:
      - in: path
        name: announcement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '204':
          description: No response body
  /api/admin/v1/announcements/{announcement_id}/schedule:
    post:
      operationId: api_admin_v1_announcements_schedule_create
      description: |-
        POST /announcements/{id}/schedule — mark SCHEDULED (Marketing+).

        Requires ``schedule_at`` to be set (via create/patch); the beat task
        ``console.tasks.send_due_announcements`` delivers it when due.
      parameters:
      - in: path
        name: announcement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
  /api/admin/v1/announcements/{announcement_id}/send:
    post:
      operationId: api_admin_v1_announcements_send_create
      description: POST /announcements/{id}/send — deliver now (Marketing+).
      parameters:
      - in: path
        name: announcement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
  /api/admin/v1/announcements/audience-preview:
    get:
      operationId: api_admin_v1_announcements_audience_preview_retrieve
      description: GET /announcements/audience-preview?audience=&param= — recipient
        count.
      parameters:
      - in: query
        name: audience
        schema:
          type: string
        description: all|plan|trial_ending|at_risk|active
      - in: query
        name: param
        schema:
          type: string
        description: plan key for the 'plan' segment
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudiencePreview'
          description: ''
  /api/admin/v1/audit:
    get:
      operationId: api_admin_v1_audit_list
      description: GET /audit — filter the admin audit trail (any admin, paginated).
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Action key contains (e.g. merchant.suspend)
      - in: query
        name: actor
        schema:
          type: string
        description: Actor email contains
      - in: query
        name: from
        schema:
          type: string
        description: From date YYYY-MM-DD (inclusive)
      - in: query
        name: target_id
        schema:
          type: string
        description: Exact target id
      - in: query
        name: target_type
        schema:
          type: string
        description: Exact target type (e.g. merchant)
      - in: query
        name: to
        schema:
          type: string
        description: To date YYYY-MM-DD (inclusive)
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/admin/v1/audit/export:
    get:
      operationId: api_admin_v1_audit_export_retrieve
      description: GET /audit/export — the filtered trail as CSV (any admin).
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Action key contains (e.g. merchant.suspend)
      - in: query
        name: actor
        schema:
          type: string
        description: Actor email contains
      - in: query
        name: from
        schema:
          type: string
        description: From date YYYY-MM-DD (inclusive)
      - in: query
        name: target_id
        schema:
          type: string
        description: Exact target id
      - in: query
        name: target_type
        schema:
          type: string
        description: Exact target type (e.g. merchant)
      - in: query
        name: to
        schema:
          type: string
        description: To date YYYY-MM-DD (inclusive)
      tags:
      - api
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
  /api/admin/v1/auth/login:
    post:
      operationId: api_admin_v1_auth_login_create
      description: POST /auth/login — email+password → tokens, or an MFA gate.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminLogin'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResult'
          description: ''
  /api/admin/v1/auth/mfa/confirm:
    post:
      operationId: api_admin_v1_auth_mfa_confirm_create
      description: POST /auth/mfa/confirm — finish voluntary enrolment with a TOTP
        code.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MfaConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MfaConfirm'
        required: true
      responses:
        '200':
          description: No response body
  /api/admin/v1/auth/mfa/setup:
    post:
      operationId: api_admin_v1_auth_mfa_setup_create
      description: |-
        POST /auth/mfa/setup — voluntarily start MFA enrolment (already logged in).

        Returns fresh provisioning data; ``/auth/mfa/confirm`` completes it. Useful
        for non-privileged roles that want MFA even though it isn't forced.
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
          description: ''
  /api/admin/v1/auth/mfa/verify:
    post:
      operationId: api_admin_v1_auth_mfa_verify_create
      description: |-
        POST /auth/mfa/verify — complete a login: pending token + TOTP → tokens.

        Handles both the ``mfa_challenge`` (already enrolled) and ``mfa_setup``
        (enrolling now — flips ``mfa_enabled`` on first valid code) flows.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MfaVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MfaVerify'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminToken'
          description: ''
  /api/admin/v1/auth/refresh:
    post:
      operationId: api_admin_v1_auth_refresh_create
      description: POST /auth/refresh — rotate the refresh token → a fresh pair.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminRefresh'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminToken'
          description: ''
  /api/admin/v1/auth/sessions:
    get:
      operationId: api_admin_v1_auth_sessions_list
      description: |-
        GET /auth/sessions — this admin's active sessions/devices.
        DELETE /auth/sessions — "log out everywhere" (keeps the current session).
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminSession'
          description: ''
    delete:
      operationId: api_admin_v1_auth_sessions_destroy
      description: |-
        GET /auth/sessions — this admin's active sessions/devices.
        DELETE /auth/sessions — "log out everywhere" (keeps the current session).
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/admin/v1/auth/sessions/{session_id}:
    delete:
      operationId: api_admin_v1_auth_sessions_destroy_2
      description: DELETE /auth/sessions/{id} — revoke one specific session/device.
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/admin/v1/auth/step-up:
    post:
      operationId: api_admin_v1_auth_step_up_create
      description: |-
        POST /auth/step-up — re-prove credentials to unlock a sensitive action.

        Refreshes the session's ``last_auth_at``; sensitive endpoints require it to
        be recent. Requires the password, plus a TOTP code when MFA is enabled.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUp'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StepUp'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StepUp'
        required: true
      responses:
        '200':
          description: No response body
  /api/admin/v1/billing/dunning:
    get:
      operationId: api_admin_v1_billing_dunning_list
      description: GET /billing/dunning — merchants whose subscription is PAST_DUE.
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DunningRow'
          description: ''
  /api/admin/v1/billing/reconciliation:
    get:
      operationId: api_admin_v1_billing_reconciliation_retrieve
      description: GET /billing/reconciliation — internal invoice/subscription consistency
        report.
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconciliation'
          description: ''
  /api/admin/v1/compliance/retention:
    get:
      operationId: api_admin_v1_compliance_retention_retrieve
      description: |-
        GET /compliance/retention — the global policy (any admin).
        PATCH — edit it (``RETENTION_MANAGE``; super-admin only; audited).
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
          description: ''
    patch:
      operationId: api_admin_v1_compliance_retention_partial_update
      description: |-
        GET /compliance/retention — the global policy (any admin).
        PATCH — edit it (``RETENTION_MANAGE``; super-admin only; audited).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRetentionPolicy'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRetentionPolicy'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRetentionPolicy'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
          description: ''
  /api/admin/v1/coupon-groups:
    get:
      operationId: api_admin_v1_coupon_groups_list
      description: |-
        GET /coupon-groups (any admin, paginated) · POST create (Finance+).

        Groups are a purely organisational wrapper over coupons (Phase 11 deferral):
        a coupon works identically whether grouped or not.
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CouponGroup'
          description: ''
    post:
      operationId: api_admin_v1_coupon_groups_create
      description: |-
        GET /coupon-groups (any admin, paginated) · POST create (Finance+).

        Groups are a purely organisational wrapper over coupons (Phase 11 deferral):
        a coupon works identically whether grouped or not.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponGroupWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CouponGroupWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CouponGroupWrite'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponGroup'
          description: ''
  /api/admin/v1/coupon-groups/{group_id}:
    get:
      operationId: api_admin_v1_coupon_groups_retrieve
      description: GET /coupon-groups/{id} (any admin) · PATCH/DELETE (Finance+).
      parameters:
      - in: path
        name: group_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponGroup'
          description: ''
    patch:
      operationId: api_admin_v1_coupon_groups_partial_update
      description: GET /coupon-groups/{id} (any admin) · PATCH/DELETE (Finance+).
      parameters:
      - in: path
        name: group_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCouponGroupWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCouponGroupWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCouponGroupWrite'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponGroup'
          description: ''
    delete:
      operationId: api_admin_v1_coupon_groups_destroy
      description: GET /coupon-groups/{id} (any admin) · PATCH/DELETE (Finance+).
      parameters:
      - in: path
        name: group_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      responses:
        '204':
          description: No response body
  /api/admin/v1/coupons:
    get:
      operationId: api_admin_v1_coupons_list
      description: GET /coupons (any admin) · POST create (Finance+).
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Coupon'
          description: ''
    post:
      operationId: api_admin_v1_coupons_create
      description: GET /coupons (any admin) · POST create (Finance+).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CouponCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CouponCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
          description: ''
  /api/admin/v1/coupons/{code}:
    get:
      operationId: api_admin_v1_coupons_retrieve
      description: GET /coupons/{code} (any admin) · PATCH (Finance+).
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
          description: ''
    patch:
      operationId: api_admin_v1_coupons_partial_update
      description: GET /coupons/{code} (any admin) · PATCH (Finance+).
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
