  # ── Apple Wallet web service (Phase 1.1 · Momen — Apple's camelCase spec) ───
  /api/v1/wallet/apple/v1/devices/{device_library_id}/registrations/{pass_type_id}/{serial}:
    parameters:
      - { name: device_library_id, in: path, required: true, schema: { type: string } }
      - { name: pass_type_id, in: path, required: true, schema: { type: string } }
      - { name: serial, in: path, required: true, schema: { type: string } }
    post:
      operationId: post_apple_devices_by_device_library_id_registrations_by_pass_type_id_by_serial
      tags: [Apple Wallet]
      summary: Register a device for a pass
      description: Body uses Apple's camelCase (e.g. `pushToken`). External spec — not snake_case.
      security:
        - applePassAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pushToken: { type: string }
      responses:
        "201": { description: Registered }
        "200": { description: Already registered }
        "401": { description: Unauthorized }
    delete:
      operationId: delete_apple_devices_by_device_library_id_registrations_by_pass_type_id_by_serial
      tags: [Apple Wallet]
      summary: Unregister a device for a pass
      security:
        - applePassAuth: []
      responses:
        "200": { description: Unregistered }
        "401": { description: Unauthorized }

  /api/v1/wallet/apple/v1/devices/{device_library_id}/registrations/{pass_type_id}:
    parameters:
      - { name: device_library_id, in: path, required: true, schema: { type: string } }
      - { name: pass_type_id, in: path, required: true, schema: { type: string } }
      - name: passesUpdatedSince
        in: query
        required: false
        schema: { type: string }
    get:
      operationId: get_apple_devices_by_device_library_id_registrations_by_pass_type_id
      tags: [Apple Wallet]
      summary: List serials updated since a tag
      responses:
        "200":
          description: Serials + last updated tag
          content:
            application/json:
              schema:
                type: object
                properties:
                  serialNumbers:
                    type: array
                    items: { type: string }
                  lastUpdated: { type: string }
        "204": { description: No matching passes }

  /api/v1/wallet/apple/v1/passes/{pass_type_id}/{serial}:
    parameters:
      - { name: pass_type_id, in: path, required: true, schema: { type: string } }
      - { name: serial, in: path, required: true, schema: { type: string } }
    get:
      operationId: get_apple_passes_by_pass_type_id_by_serial
      tags: [Apple Wallet]
      summary: Fetch the latest .pkpass for a serial
      security:
        - applePassAuth: []
      responses:
        "200":
          description: The signed pass
          content:
            application/vnd.apple.pkpass:
              schema: { type: string, format: binary }
        "401": { description: Unauthorized }
        "304": { description: Not modified }

  /api/v1/wallet/apple/v1/log:
    post:
      operationId: post_apple_log
      tags: [Apple Wallet]
      summary: Apple device log sink
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                logs:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: Logged }

components:
  securitySchemes:
    bearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
    applePassAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "ApplePass <CustomerCard.auth_token>"

  parameters:
    EnrollToken:
      name: token
      in: path
      required: true
      schema: { type: string }
    InviteToken:
      name: t
      in: path
      required: true
      schema: { type: string }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AutomationKey:
      name: key
      in: path
      required: true
      schema: { type: string, enum: [reward_ready, expiry, birthday, winback, welcome] }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, default: 25, maximum: 100 }
    DateFrom:
      name: from
      in: query
      required: false
      schema: { type: string, format: date }
    DateTo:
      name: to
      in: query
      required: false
      schema: { type: string, format: date }

  responses:
    Error:
      description: Error (contract §3.7 envelope)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHENTICATED
                - PERMISSION_DENIED
                - NOT_FOUND
                - CONFLICT
                - ALREADY_ENROLLED
                - TOKEN_EXPIRED
                - COOLDOWN_ACTIVE
                - RATE_LIMITED
                - REWARD_NOT_READY
                - PLAN_LIMIT
                - WALLET_PROVISION_FAILED
                - SERVER_ERROR
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
    Ok:
      type: object
      properties:
        ok: { type: boolean }
    PaginatedList:
      type: object
      properties:
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { type: object }
    TokenPair:
      type: object
      properties:
        access: { type: string }
        refresh: { type: string }

    # ── Domain objects (spec §4) ──────────────────────────────────────────────
    Merchant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [trial, active, suspended] }
        plan: { type: string, enum: [trial, starter, growth, chain] }
        trial_ends_at: { type: string, format: date-time, nullable: true }
        logo_url: { type: string, nullable: true }
        color_bg: { type: string }
        color_fg: { type: string }
      required: [id, name, slug, status, plan]

    Entitlements:
      type: object
      properties:
        plan: { type: string, enum: [trial, starter, growth, chain] }
        limits:
          type: object
          description: "null = unlimited"
          properties:
            max_cards: { type: integer, nullable: true }
            max_locations: { type: integer, nullable: true }
            max_staff: { type: integer, nullable: true }
            max_customers: { type: integer, nullable: true }
        features:
          type: object
          properties:
            whatsapp: { type: boolean }
            export: { type: boolean }
            api: { type: boolean }
            automations: { type: integer }
            analytics: { type: string, enum: [basic, full] }
        usage: { $ref: "#/components/schemas/Usage" }
      required: [plan, limits, features, usage]
    Usage:
      type: object
      properties:
        cards: { type: integer }
        locations: { type: integer }
        staff: { type: integer }
        customers: { type: integer }
        whatsapp_used: { type: integer }
        whatsapp_quota: { type: integer, nullable: true }

    Card:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [STAMP] }
        name: { type: string }
        stamps_required: { type: integer, minimum: 1, maximum: 30 }
        reward_title: { type: string }
        reward_description: { type: string }
        color_bg: { type: string }
        color_fg: { type: string }
        logo_url: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        holders: { type: integer }
        stamps_issued: { type: integer }
        rewards_redeemed: { type: integer }
      required: [id, name, stamps_required, reward_title, status]
    CardWrite:
      type: object
      properties:
        name: { type: string }
        stamps_required: { type: integer, minimum: 1, maximum: 30 }
        reward_title: { type: string }
        reward_description: { type: string }
        color_bg: { type: string }
        color_fg: { type: string }
        logo_url: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
    CardStats:
      type: object
      properties:
        holders: { type: integer }
        stamps_issued: { type: integer }
        rewards_redeemed: { type: integer }
        completion_rate: { type: number, format: float }
        apple_count: { type: integer }
        google_count: { type: integer }

    CustomerCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_name: { type: string, nullable: true }
        customer_phone: { type: string }
        stamp_count: { type: integer }
        stamps_required: { type: integer }
        wallet_platform: { type: string, enum: [APPLE, GOOGLE], nullable: true }
        status: { type: string }
        birthday: { type: string, format: date, nullable: true }
        consent_at: { type: string, format: date-time }
        last_event_at: { type: string, format: date-time, nullable: true }
        enrolled_at: { type: string, format: date-time }
      required: [id, customer_phone, stamp_count, stamps_required]
    TimelineEvent:
      type: object
      properties:
        event_type: { type: string, enum: [enroll, stamp, redeem, message] }
        delta: { type: integer }
        balance_after: { type: integer }
        staff_name: { type: string, nullable: true }
        location: { type: string, nullable: true }
        gps: { type: string, nullable: true }
        at: { type: string, format: date-time }
      required: [event_type, at]

    Campaign:
      type: object
      properties:
        id: { type: string, format: uuid }
        channel: { type: string, enum: [PUSH, WHATSAPP, BOTH] }
        audience: { type: string }
        message: { type: string }
        status: { type: string }
        schedule_at: { type: string, format: date-time, nullable: true }
        sent_at: { type: string, format: date-time, nullable: true }
        stats:
          type: object
          properties:
            delivered: { type: integer }
            opened: { type: integer }
      required: [id, channel, audience, message, status]
    CampaignWrite:
      type: object
      required: [channel, audience, message]
      properties:
        channel: { type: string, enum: [PUSH, WHATSAPP, BOTH] }
        audience: { type: string }
        message: { type: string }
        schedule_at: { type: string, format: date-time, nullable: true }
    Segment:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        count: { type: integer }
      required: [key, label, count]
    Automation:
      type: object
      properties:
        key: { type: string, enum: [reward_ready, expiry, birthday, winback, welcome] }
        enabled: { type: boolean }
        channel: { type: string, enum: [PUSH, WHATSAPP, BOTH] }
        timing: { type: string }
        template: { type: string }
      required: [key, enabled]

    Location:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        staff_count: { type: integer }
        stamps_issued: { type: integer }
      required: [id, name, address]
    LocationWrite:
      type: object
      required: [name, address]
      properties:
        name: { type: string }
        address: { type: string }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
    LocationStat:
      type: object
      properties:
        location_id: { type: string, format: uuid }
        name: { type: string }
        stamps: { type: integer }
        redemptions: { type: integer }

    Staff:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [OWNER, ADMIN, SCANNER] }
        location_id: { type: string, format: uuid, nullable: true }
        is_active: { type: boolean }
      required: [id, name, email, role, is_active]
    StaffWrite:
      type: object
      properties:
        role: { type: string, enum: [OWNER, ADMIN, SCANNER] }
        location_id: { type: string, format: uuid, nullable: true }
        is_active: { type: boolean }

    # ── Analytics payloads ────────────────────────────────────────────────────
    AnalyticsSummary:
      type: object
      properties:
        enrollments: { type: integer }
        active_cards: { type: integer }
        redemptions: { type: integer }
        apple_count: { type: integer }
        google_count: { type: integer }
        repeat_rate: { type: number, format: float }
    TimeseriesPoint:
      type: object
      properties:
        date: { type: string, format: date }
        value: { type: number }
      required: [date, value]
    RetentionPoint:
      type: object
      properties:
        day: { type: integer }
        retained_pct: { type: number, format: float }
      required: [day, retained_pct]
    ActivityItem:
      type: object
      properties:
        type: { type: string, enum: [join, stamp, redeem] }
        actor_name: { type: string, nullable: true }
        customer_name: { type: string, nullable: true }
        location: { type: string, nullable: true }
        at: { type: string, format: date-time }
      required: [type, at]

    # ── Billing ───────────────────────────────────────────────────────────────
    BillingState:
      type: object
      properties:
        plan: { type: string, enum: [trial, starter, growth, chain] }
        trial_ends_at: { type: string, format: date-time, nullable: true }
        price_egp: { type: number, description: "Amount in EGP (major units)" }
        usage: { $ref: "#/components/schemas/Usage" }
        next_renewal: { type: string, format: date-time, nullable: true }
        payment_method:
          type: object
          nullable: true
          properties:
            brand: { type: string }
            last4: { type: string }
    Invoice:
      type: object
      properties:
        id: { type: string }
        date: { type: string, format: date }
        amount_egp: { type: number, description: "Amount in EGP (major units)" }
        status: { type: string, enum: [paid, pending, failed] }
        pdf_url: { type: string }
      required: [id, date, amount_egp, status]

    # ── Settings ──────────────────────────────────────────────────────────────
    BusinessSettings:
      type: object
      properties:
        name: { type: string }
        legal_name: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        color_bg: { type: string }
