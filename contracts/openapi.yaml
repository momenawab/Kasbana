        sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        recipients:
          type: integer
          readOnly: true
        emails_sent:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        stats:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - body
      - created_at
      - emails_sent
      - id
      - recipients
      - sent_at
      - stats
      - status
      - title
      - updated_at
    AnnouncementStatusEnum:
      enum:
      - draft
      - scheduled
      - sent
