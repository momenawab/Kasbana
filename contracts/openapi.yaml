components:
  schemas:
    AccountSettingsOut:
      type: object
      properties:
        language:
          type: string
        notifications:
          type: object
          additionalProperties: {}
      required:
      - language
      - notifications
    ActionEnum:
      enum:
      - approve
      - reject
      type: string
      description: |-
        * `approve` - approve
        * `reject` - reject
    ActivityEvent:
      type: object
      properties:
        type:
          type: string
        at:
          type: string
          format: date-time
        summary:
          type: string
        meta:
          type: object
          additionalProperties: {}
      required:
      - at
      - meta
      - summary
      - type
    ActivityItem:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ActivityItemTypeEnum'
        actor_name:
          type: string
          nullable: true
        customer_name:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        at:
          type: string
          format: date-time
      required:
      - actor_name
      - at
      - customer_name
      - location
      - type
    ActivityItemTypeEnum:
      enum:
      - join
      - stamp
      - redeem
      type: string
      description: |-
        * `join` - join
        * `stamp` - stamp
        * `redeem` - redeem
    ActivityResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ActivityItem'
      required:
      - results
    AdminActivity:
      type: object
      properties:
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        metadata:
          type: object
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
      required:
      - action
      - created_at
      - metadata
      - target_id
      - target_type
    AdminContactMessageCreate:
      type: object
      description: |-
        Admin-created contact message — lets the admin compose a message entry
        with a specific recipient so it can then be replied to via the existing flow.
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        subject:
          type: string
          maxLength: 200
        message:
          type: string
      required:
      - email
      - message
      - name
      - subject
    AdminInvite:
      type: object
      description: |-
        Create a new admin. A one-time temporary password is generated server-side
        and returned once (MFA + a proper invite-email flow are Phase 15).
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 120
        role:
          $ref: '#/components/schemas/RoleDadEnum'
      required:
      - email
      - role
    AdminInviteResult:
      type: object
      properties:
        admin:
          $ref: '#/components/schemas/AdminUser'
        temporary_password:
          type: string
      required:
      - admin
      - temporary_password
    AdminLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    AdminLoginResult:
      type: object
      description: |-
        Login outcome. ``status`` is ``ok`` (tokens present), ``mfa_required``
        (enter a code), or ``mfa_setup`` (enrol first — QR + secret present).
      properties:
        status:
          $ref: '#/components/schemas/AdminLoginResultStatusEnum'
        access:
          type: string
        refresh:
          type: string
        pending_token:
          type: string
        otpauth_uri:
          type: string
        secret:
          type: string
        qr:
          type: string
      required:
      - status
    AdminLoginResultStatusEnum:
      enum:
      - ok
      - mfa_required
      - mfa_setup
      type: string
      description: |-
        * `ok` - ok
        * `mfa_required` - mfa_required
        * `mfa_setup` - mfa_setup
    AdminMe:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
        mfa_enabled:
          type: boolean
        mfa_required:
          type: boolean
        permissions:
          type: array
          items:
            type: string
      required:
      - email
      - id
      - mfa_enabled
      - mfa_required
      - name
      - permissions
      - role
    AdminRefresh:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    AdminSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_agent:
          type: string
        ip:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        current:
          type: boolean
      required:
      - created_at
      - current
      - id
      - ip
      - last_seen_at
      - user_agent
    AdminToken:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          maxLength: 120
        role:
          $ref: '#/components/schemas/RoleDadEnum'
        is_active:
          type: boolean
        mfa_enabled:
          type: boolean
        mfa_required:
          type: boolean
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          readOnly: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - mfa_required
      - permissions
    AnalyticsEnum:
      enum:
      - basic
      - full
      type: string
      description: |-
        * `basic` - Basic
        * `full` - Full
    AnalyticsSummary:
      type: object
      description: GET /analytics/summary response (contract §3.6).
      properties:
        enrollments:
          type: integer
        active_cards:
          type: integer
        redemptions:
          type: integer
        apple_count:
          type: integer
        google_count:
          type: integer
        repeat_rate:
          type: number
          format: double
      required:
      - active_cards
      - apple_count
      - enrollments
      - google_count
      - redemptions
      - repeat_rate
    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 160
        body:
          type: string
        channel:
          $ref: '#/components/schemas/Channel829Enum'
        audience:
          $ref: '#/components/schemas/AudienceEnum'
