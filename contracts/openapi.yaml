        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMainQrUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMainQrUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMainQrUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainQr'
          description: ''
  /api/v1/settings/main-qr/rotate:
    post:
      operationId: settings_main_qr_rotate_create
