        The Card Designer's fields, plus the prospect's business name.

        ``merchant_name`` is free text on purpose: the whole point is to brand a pass
        for a business that has not signed up yet, so it never resolves to a real
        merchant record.
      properties:
        merchant_name:
          type: string
          maxLength: 120
        name:
          type: string
          maxLength: 120
        type:
          allOf:
          - $ref: '#/components/schemas/DemoCardCreateTypeEnum'
          default: STAMP
        stamps_required:
          type: integer
          maximum: 30
          minimum: 1
          default: 8
        reward_title:
          type: string
          maxLength: 120
        reward_description:
          type: string
          default: ''
        color_bg:
          type: string
          default: ''
          maxLength: 7
        color_fg:
          type: string
          default: ''
          maxLength: 7
        logo_url:
          type: string
          format: uri
          default: ''
        hero_image_url:
          type: string
          format: uri
          default: ''
        single_use:
          type: boolean
          default: false
        referral_enabled:
          type: boolean
          default: false
        preview_stamps:
          type: integer
          maximum: 30
          minimum: 0
          default: 0
      required:
      - merchant_name
      - name
      - reward_title
