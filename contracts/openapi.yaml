openapi: 3.0.3
info:
  title: Stampn API
  version: "1.1.0"
  description: >
    Stampn — digital loyalty & wallet-pass platform. The **authoritative v1
    contract**. Backend phases and the Client Dashboard frontend build against
    these exact paths and snake_case JSON keys. Any change is a joint PR to the
    contract first.

    Ownership: Auth + Enrollment + Apple Wallet web service + Billing webhooks =
    Momen (Phases 1.0/1.1/1.4). Loyalty + Dashboard = Joe (Phases 1.2/1.3).

    **Dashboard-proposed paths.** Operations tagged `x-status: dashboard-proposed`
    are the Client Dashboard endpoints authored frontend-first (spec §6) that the
    backend still owes during/after phases 1.2/1.3/1.4. Until they are verified on
    staging they are implemented by MSW on the frontend. They introduce NO behavior
    beyond `main/docs/Frontend-dashboard-plan.md` §6.

    Conventions: snake_case JSON keys · EGP money (major units, `*_egp` fields) ·
    cursor pagination `{ next, previous, results }` · shared error envelope
    `{ error: { code, message, fields } }` · list money never negative.

servers:
  - url: https://api.stampn.net
    description: Production
  - url: http://localhost:8000
    description: Local

security:
  - bearerJWT: []

tags:
  - name: Auth
    description: Merchant authentication & session.
  - name: Account
    description: Current merchant / entitlements (/me).
  - name: Enrollment
    description: Public customer enrollment via QR token.
  - name: Loyalty
    description: Stamp & redeem operations.
  - name: Cards
    description: Stamp-card design & management.
  - name: Customers
    description: Customer cards, timeline, messaging.
  - name: Analytics
    description: Merchant analytics & activity feed.
  - name: Engage
    description: Campaigns, segments, automations.
  - name: Locations
    description: Branch locations.
  - name: Team
    description: Staff & roles.
  - name: Billing
    description: Subscriptions, invoices, webhooks.
  - name: Settings
    description: Business & account settings.
  - name: Apple Wallet
    description: Apple PassKit web service (Apple camelCase).

paths:
  # ── Auth (Phase 1.0 · Momen) ───────────────────────────────────────────────
  /api/v1/auth/token:
    post:
      operationId: post_auth_token
      tags: [Auth]
      summary: Obtain JWT access + refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/refresh:
    post:
      operationId: post_auth_refresh
      tags: [Auth]
      summary: Refresh an access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh: { type: string }
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access: { type: string }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/auth/signup:
    post:
      operationId: post_auth_signup
      tags: [Auth]
      summary: Register a merchant + owner and start a 14-day trial
      x-status: dashboard-proposed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_name, owner_name, email, phone, password, consent]
              properties:
                business_name: { type: string }
                owner_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string, description: "E.164" }
                password: { type: string, format: password, minLength: 8 }
                consent: { type: boolean, description: "PDPL consent" }
      responses:
        "200":
          description: Token pair (session started)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/auth/forgot:
    post:
      operationId: post_auth_forgot
      tags: [Auth]
      summary: Request a password-reset email
      x-status: dashboard-proposed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Always ok (does not leak whether the email exists)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  /api/v1/auth/reset:
    post:
      operationId: post_auth_reset
      tags: [Auth]
      summary: Reset password with a token
      x-status: dashboard-proposed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 8 }
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/auth/invite/{t}:
    parameters:
      - $ref: "#/components/parameters/InviteToken"
    get:
      operationId: get_auth_invite_by_t
      tags: [Auth]
      summary: Inspect a staff invite (merchant + role + email)
      x-status: dashboard-proposed
      security: []
      responses:
        "200":
          description: Invite details
          content:
            application/json:
              schema:
                type: object
                properties:
                  merchant_name: { type: string }
                  role: { type: string, enum: [OWNER, ADMIN, SCANNER] }
                  email: { type: string, format: email }
        "410": { $ref: "#/components/responses/Error" }
    post:
      operationId: post_auth_invite_by_t
      tags: [Auth]
      summary: Accept a staff invite (set password) and start a session
      x-status: dashboard-proposed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, minLength: 8 }
      responses:
        "200":
          description: Token pair (session started)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  # ── Account (/me) ──────────────────────────────────────────────────────────
  /api/v1/me:
    get:
      operationId: get_me
      tags: [Account]
      summary: Current merchant + entitlements + caller role
      x-status: dashboard-proposed
      responses:
        "200":
          description: Session context
          content:
            application/json:
              schema:
                type: object
                required: [merchant, entitlements, staff]
                properties:
                  merchant: { $ref: "#/components/schemas/Merchant" }
                  entitlements: { $ref: "#/components/schemas/Entitlements" }
                  staff:
                    type: object
                    properties:
                      role: { type: string, enum: [OWNER, ADMIN, SCANNER] }
        "401": { $ref: "#/components/responses/Error" }

  # ── Enrollment (Phase 1.1 · Momen) ─────────────────────────────────────────
  /api/v1/enroll/{token}:
    parameters:
      - $ref: "#/components/parameters/EnrollToken"
    get:
      operationId: get_enroll_by_token
      tags: [Enrollment]
      summary: Public enrollment landing — describes the program behind a QR token
      security: []
      responses:
        "200":
          description: Program details
          content:
            application/json:
              schema:
                type: object
                properties:
                  merchant_name: { type: string }
                  card_name: { type: string }
                  reward_title: { type: string }
                  stamps_required: { type: integer }
                  color_bg: { type: string }
                  color_fg: { type: string }
                  logo_url: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
    post:
      operationId: post_enroll_by_token
      tags: [Enrollment]
      summary: Enroll a customer and provision wallet passes
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_phone, consent]
              properties:
                customer_phone: { type: string, description: E.164 }
                customer_name: { type: string }
                consent: { type: boolean, description: PDPL consent }
      responses:
        "201":
          description: Enrolled
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_card_id: { type: string, format: uuid }
                  stamp_count: { type: integer }
                  stamps_required: { type: integer }
                  apple_pass_url: { type: string, nullable: true }
                  google_save_url: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }

  # ── Loyalty (Phase 1.2 · Joe) ──────────────────────────────────────────────
  /api/v1/loyalty/stamp:
    post:
      operationId: post_loyalty_stamp
      tags: [Loyalty]
      summary: Add a stamp to a card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_card_id]
              properties:
                customer_card_id: { type: string, format: uuid }
                delta: { type: integer, default: 1 }
      responses:
        "200":
          description: Updated balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_card_id: { type: string, format: uuid }
                  stamp_count: { type: integer }
                  stamps_required: { type: integer }
                  reward_ready: { type: boolean }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/loyalty/redeem:
    post:
      operationId: post_loyalty_redeem
      tags: [Loyalty]
      summary: Redeem a reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_card_id, reward_id]
              properties:
                customer_card_id: { type: string, format: uuid }
                reward_id: { type: string, format: uuid }
      responses:
        "200":
          description: Redemption result
          content:
            application/json:
              schema:
                type: object
                properties:
                  redemption_id: { type: string, format: uuid }
                  status: { type: string }
                  stamp_count: { type: integer }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/loyalty/cards/{customer_card_id}:
    parameters:
      - name: customer_card_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: get_loyalty_cards_by_customer_card_id
      tags: [Loyalty]
      summary: Read a customer card's current state
      responses:
        "200":
          description: Card state
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_card_id: { type: string, format: uuid }
                  customer_name: { type: string }
                  stamp_count: { type: integer }
                  stamps_required: { type: integer }
                  reward_ready: { type: boolean }
                  status: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  # ── Cards (Dashboard · Phase 1.3 · Joe) ────────────────────────────────────
  /api/v1/cards:
    get:
      operationId: get_cards
      tags: [Cards]
      summary: List stamp cards
      x-status: dashboard-proposed
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
      responses:
        "200":
          description: Paginated cards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: "#/components/schemas/Card" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: post_cards
      tags: [Cards]
      summary: Create a stamp card (draft or active)
      x-status: dashboard-proposed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardWrite" }
      responses:
        "201":
          description: Created card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "402": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/cards/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: get_cards_by_id
      tags: [Cards]
      summary: Read a card
      x-status: dashboard-proposed
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: patch_cards_by_id
      tags: [Cards]
      summary: Update a card (re-provisions existing holders' passes when published)
      x-status: dashboard-proposed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardWrite" }
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/cards/{id}/stats:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: get_cards_by_id_stats
      tags: [Cards]
      summary: Per-card performance stats
      x-status: dashboard-proposed
      responses:
        "200":
          description: Card stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardStats" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/cards/{id}/qr:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: get_cards_by_id_qr
      tags: [Cards]
      summary: Enrollment QR assets for a card
      x-status: dashboard-proposed
      responses:
        "200":
          description: QR assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  join_url: { type: string }
                  qr_svg: { type: string }
                  poster_pdf_url: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/uploads:
    post:
      operationId: post_uploads
      tags: [Cards]
      summary: Upload an asset (logo / image) and receive a URL
      x-status: dashboard-proposed
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  # ── Customers (Dashboard) ──────────────────────────────────────────────────
  /api/v1/customers:
    get:
      operationId: get_customers
      tags: [Customers]
      summary: List customer cards (filterable)
      x-status: dashboard-proposed
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - name: card
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: segment
          in: query
          required: false
          schema: { type: string, enum: [lapsed, reward_ready] }
        - name: location
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Paginated customer cards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: "#/components/schemas/CustomerCard" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/customers/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: get_customers_by_id
      tags: [Customers]
      summary: Read a customer card
      x-status: dashboard-proposed
      responses:
        "200":
          description: Customer card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCard" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: delete_customers_by_id
      tags: [Customers]
      summary: Delete a customer and their data (PDPL)
      x-status: dashboard-proposed
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/customers/{id}/timeline:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: get_customers_by_id_timeline
      tags: [Customers]
      summary: Customer event timeline
      x-status: dashboard-proposed
      responses:
        "200":
          description: Timeline events (chronological)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/TimelineEvent" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/customers/{id}/message:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: post_customers_by_id_message
      tags: [Customers]
      summary: Send a one-off message to a customer
      x-status: dashboard-proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, text]
              properties:
                channel: { type: string, enum: [PUSH, WHATSAPP] }
                text: { type: string }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "402": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  # ── Analytics + Activity (Dashboard) ───────────────────────────────────────
  /api/v1/analytics/summary:
    get:
      operationId: get_analytics_summary
      tags: [Analytics]
      summary: Merchant analytics summary (KPI block)
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsSummary" }

  /api/v1/analytics/timeseries:
    get:
      operationId: get_analytics_timeseries
      tags: [Analytics]
      summary: Time-series for a metric over a date range
      x-status: dashboard-proposed
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: metric
          in: query
          required: true
          schema: { type: string, enum: [joins, stamps, redemptions] }
        - name: location
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Series points
          content:
            application/json:
              schema:
                type: object
                properties:
                  points:
                    type: array
                    items: { $ref: "#/components/schemas/TimeseriesPoint" }

  /api/v1/analytics/retention:
    get:
      operationId: get_analytics_retention
      tags: [Analytics]
      summary: Retention curve + at-risk count over a date range
      x-status: dashboard-proposed
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Retention curve
          content:
            application/json:
              schema:
                type: object
                properties:
                  curve:
                    type: array
                    items: { $ref: "#/components/schemas/RetentionPoint" }
                  at_risk_count: { type: integer }

  /api/v1/analytics/by_location:
    get:
      operationId: get_analytics_by_location
      tags: [Analytics]
      summary: Per-location stamps & redemptions over a date range
      x-status: dashboard-proposed
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Per-location breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/LocationStat" }

  /api/v1/activity:
    get:
      operationId: get_activity
      tags: [Analytics]
      summary: Recent merchant activity feed
      x-status: dashboard-proposed
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityItem" }

  # ── Engage: campaigns, segments, automations (Dashboard) ───────────────────
  /api/v1/campaigns:
    get:
      operationId: get_campaigns
      tags: [Engage]
      summary: List campaigns
      x-status: dashboard-proposed
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated campaigns
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: "#/components/schemas/Campaign" }
    post:
      operationId: post_campaigns
      tags: [Engage]
      summary: Create + send/schedule a campaign
      x-status: dashboard-proposed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignWrite" }
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "402": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/segments:
    get:
      operationId: get_segments
      tags: [Engage]
      summary: List audience segments with counts
      x-status: dashboard-proposed
      responses:
        "200":
          description: Segments
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Segment" }

  /api/v1/automations:
    get:
      operationId: get_automations
      tags: [Engage]
      summary: List automations
      x-status: dashboard-proposed
      responses:
        "200":
          description: Automations
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Automation" }

  /api/v1/automations/{key}:
    parameters:
      - $ref: "#/components/parameters/AutomationKey"
    patch:
      operationId: patch_automations_by_key
      tags: [Engage]
      summary: Update an automation (enabled / channel / timing / template)
      x-status: dashboard-proposed
