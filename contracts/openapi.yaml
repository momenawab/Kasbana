  /api/v1/staff:
    get:
      operationId: staff_list
      description: GET /staff (Admin+) · POST /staff (Owner — it grants access).
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - staff
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStaffList'
          description: ''
    post:
      operationId: staff_create
      description: GET /staff (Admin+) · POST /staff (Owner — it grants access).
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCreate'
          description: ''
  /api/v1/staff/{staff_id}:
    get:
      operationId: staff_retrieve
      description: GET/PATCH /staff/{id} — read or update role/location/active.
      parameters:
      - in: path
        name: staff_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - staff
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
          description: ''
    patch:
      operationId: staff_partial_update
      description: GET/PATCH /staff/{id} — read or update role/location/active.
      parameters:
      - in: path
        name: staff_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStaffWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStaffWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStaffWrite'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffWrite'
          description: ''
  /api/v1/staff/invite:
    post:
      operationId: staff_invite_create
      description: POST /staff/invite — create a pending StaffInvite.
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffInvite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffInvite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffInvite'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffInvite'
          description: ''
  /api/v1/support/messages:
    get:
      operationId: support_messages_list
      description: GET + POST /support/messages — this merchant's support thread.
      tags:
      - support
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MerchantSupportMessage'
          description: ''
    post:
      operationId: support_messages_create
      description: GET + POST /support/messages — this merchant's support thread.
      tags:
      - support
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantSupportCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MerchantSupportCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MerchantSupportCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantSupportMessage'
          description: ''
  /api/v1/uploads:
    post:
      operationId: uploads_create
      description: |-
        POST /uploads — store a logo/image and return its URL.

        What counts as an acceptable image lives in ``common.uploads``, shared with
        the admin console's lead-logo upload: the two endpoints authenticate
        differently but must never disagree about what they accept.
      tags:
      - uploads
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
          description: ''
  /api/v1/wallet-templates:
    get:
      operationId: wallet_templates_retrieve
      description: |-
        ``GET /wallet-templates`` — the layout-locked template catalog.

        One source of truth for the backend renderers and the frontend gallery: the
        fixed per-platform layouts live in code (``wallets.templates``); this exposes
        the compact, frontend-safe list plus the platform-logo URL (so the preview
        can render the real bottom-right logo when configured).
      tags:
      - wallets
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTemplateList'
          description: ''
  /api/v1/webhooks/whatsapp/:
    get:
      operationId: webhooks_whatsapp_retrieve
      tags:
      - webhooks
      security:
      - {}
      responses:
        '200':
          description: No response body
    post:
      operationId: webhooks_whatsapp_create
      tags:
      - webhooks
      security:
      - {}
      responses:
        '200':
          description: No response body
components:
  schemas:
    AccountSettingsOut:
      type: object
      properties:
        language:
          type: string
        notifications:
          type: object
          additionalProperties: {}
      required:
      - language
      - notifications
    ActivityEvent:
      type: object
      properties:
        type:
          type: string
        at:
          type: string
          format: date-time
        summary:
          type: string
        meta:
          type: object
          additionalProperties: {}
      required:
      - at
      - meta
      - summary
      - type
    ActivityItem:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ActivityItemTypeEnum'
        actor_name:
          type: string
          nullable: true
        customer_name:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        at:
          type: string
          format: date-time
      required:
      - actor_name
      - at
      - customer_name
      - location
      - type
    ActivityItemTypeEnum:
      enum:
      - join
      - stamp
      - redeem
      type: string
      description: |-
        * `join` - join
        * `stamp` - stamp
        * `redeem` - redeem
    ActivityResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ActivityItem'
      required:
      - results
    AdminActivity:
      type: object
      properties:
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        metadata:
          type: object
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
      required:
      - action
      - created_at
      - metadata
      - target_id
      - target_type
    AdminContactMessageCreate:
      type: object
      description: |-
        Admin-created contact message — lets the admin compose a message entry
        with a specific recipient so it can then be replied to via the existing flow.
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        subject:
          type: string
          maxLength: 200
        message:
          type: string
      required:
      - email
      - message
      - name
      - subject
    AdminInvite:
      type: object
      description: |-
        Create a new admin. A one-time temporary password is generated server-side
        and returned once (MFA + a proper invite-email flow are Phase 15).
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 120
        role:
          $ref: '#/components/schemas/Role4e0Enum'
      required:
      - email
      - role
    AdminInviteResult:
      type: object
      properties:
        admin:
          $ref: '#/components/schemas/AdminUser'
        temporary_password:
          type: string
      required:
      - admin
      - temporary_password
    AdminLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    AdminLoginResult:
      type: object
      description: |-
        Login outcome. ``status`` is ``ok`` (tokens present), ``mfa_required``
        (enter a code), or ``mfa_setup`` (enrol first — QR + secret present).
      properties:
        status:
          $ref: '#/components/schemas/AdminLoginResultStatusEnum'
        access:
          type: string
        refresh:
          type: string
        pending_token:
          type: string
        otpauth_uri:
          type: string
        secret:
          type: string
        qr:
          type: string
      required:
      - status
    AdminLoginResultStatusEnum:
      enum:
      - ok
      - mfa_required
      - mfa_setup
      type: string
      description: |-
        * `ok` - ok
        * `mfa_required` - mfa_required
        * `mfa_setup` - mfa_setup
    AdminMe:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
        mfa_enabled:
          type: boolean
        mfa_required:
          type: boolean
        permissions:
          type: array
          items:
            type: string
      required:
      - email
      - id
      - mfa_enabled
      - mfa_required
      - name
      - permissions
      - role
    AdminRefresh:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    AdminSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_agent:
          type: string
        ip:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        current:
          type: boolean
      required:
      - created_at
      - current
      - id
      - ip
      - last_seen_at
      - user_agent
    AdminToken:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          maxLength: 120
        role:
          $ref: '#/components/schemas/Role4e0Enum'
        is_active:
          type: boolean
        mfa_enabled:
          type: boolean
        mfa_required:
          type: boolean
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          readOnly: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - mfa_required
      - permissions
    AdminWalletCardDesign:
      type: object
      description: |-
        The design serializer plus the admin-only raw pass JSON overlays.

        Two things separate it from the merchant serializer:

        * ``apple_overlay``/``google_overlay`` are writable. They are deliberately
          absent from the merchant serializer — a raw pass payload is a platform-admin
          tool, and exposing it on the dashboard endpoint would let any merchant author
          arbitrary pass content.
        * The template ``editable`` allowlist is not applied. An admin building a
          bespoke card is authoring *past* the template registry by definition, so
          locking them to a template's editable set would defeat the feature.
      properties:
        label_color:
          type: string
          pattern: ^#(?:[0-9a-fA-F]{6})$
          maxLength: 7
        apple_logo_text:
          type: string
          maxLength: 40
        apple_header: {}
        apple_primary: {}
        apple_secondary: {}
        apple_auxiliary: {}
        apple_back: {}
        apple_strip_enabled:
          type: boolean
        strip_bg_color:
          type: string
          pattern: ^#(?:[0-9a-fA-F]{6})$
          maxLength: 7
        strip_empty_url:
          type: string
          format: uri
          maxLength: 200
        strip_filled_url:
          type: string
          format: uri
          maxLength: 200
        stamp_icon:
          type: string
          maxLength: 20
        stamp_color:
          type: string
          pattern: ^#(?:[0-9a-fA-F]{6})$
          maxLength: 7
        stamp_layout:
          oneOf:
          - $ref: '#/components/schemas/StampLayoutEnum'
          - $ref: '#/components/schemas/BlankEnum'
        google_title:
          type: string
          maxLength: 40
        google_subtitle:
          type: string
          maxLength: 60
        google_rows: {}
        google_stamp_hero:
          type: boolean
        template_key:
          type: string
          maxLength: 40
        bottom_image_url:
          type: string
          format: uri
          maxLength: 200
        strip_bg_image_url:
          type: string
          format: uri
          maxLength: 200
        strip_stamps_visible:
          type: boolean
        apple_overlay: {}
        google_overlay: {}
    AiEnrichment:
      type: object
      description: |-
        The AI queue row and the lead drawer's AI tab.

        ``raw_response`` is excluded: it is large, it is only useful when debugging a
        specific bad answer, and the queue renders hundreds of these.
