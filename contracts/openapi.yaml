          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusC7bEnum'
        model:
          type: string
          maxLength: 64
        prompt_version:
          type: string
          maxLength: 16
        business_summary:
          type: string
        target_customers:
          type: string
          maxLength: 500
        estimated_size:
          type: string
          maxLength: 64
        estimated_daily_visitors:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        estimated_monthly_customers:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        estimated_revenue_range:
          type: string
          maxLength: 120
        business_model:
          type: string
          maxLength: 64
        is_franchise:
          type: boolean
          nullable: true
        is_premium:
          type: boolean
          nullable: true
        estimated_branches:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        likelihood_uses_pos:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        likelihood_uses_loyalty:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        likelihood_accepts_digital:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        recommended_pitch:
          type: string
        recommended_plan:
          type: string
          maxLength: 64
        risk_level:
          oneOf:
          - $ref: '#/components/schemas/RiskLevelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        confidence:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        tokens_in:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        tokens_out:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        cost_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,6})?$
        duration_ms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        attempts:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        error:
          type: string
          maxLength: 500
        lead:
          type: string
          format: uuid
      required:
      - business_name
      - created_at
      - id
      - lead
      - risk_level_display
      - updated_at
