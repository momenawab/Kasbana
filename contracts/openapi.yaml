          type: string
          maxLength: 64
        target_type:
          type: string
          maxLength: 48
        target_id:
          type: string
          maxLength: 64
        metadata: {}
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 256
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - id
    Automation:
      type: object
      properties:
        key:
          allOf:
          - $ref: '#/components/schemas/KeyEnum'
          readOnly: true
        enabled:
          type: boolean
        channel:
          $ref: '#/components/schemas/ChannelAf8Enum'
        timing:
          type: string
          maxLength: 64
