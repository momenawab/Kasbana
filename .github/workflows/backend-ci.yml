name: Backend CI

# Runs the backend quality gate (ruff · black · mypy · pytest) on every push to
# dev and on pull requests that touch the backend or the API contract.
# Independent of distribute.yml — this gates code; that publishes branches.

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Mypy (type check)
        run: mypy .

      - name: Django system check
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      - name: Pytest (with coverage)
        run: pytest --cov=. --cov-report=term-missing:skip-covered --cov-report=xml
