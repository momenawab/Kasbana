name: Frontend CI

# Runs the frontend quality gate (lint · Vitest · build) for all three apps, and
# a Playwright end-to-end smoke test, on every push to dev and on PRs that touch
# any frontend or the e2e suite. Independent of the deploy workflows — this gates
# code; those publish builds.

on:
  push:
    branches: [dev]
    paths:
      - "frontend/**"
      - "e2e/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "e2e/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, frontend/dashboard, frontend/admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Playwright starts each app's Vite dev server (see e2e/playwright.config.js),
      # so every frontend needs its dependencies installed.
      - name: Install app dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix frontend/dashboard
          npm ci --prefix frontend/admin

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
