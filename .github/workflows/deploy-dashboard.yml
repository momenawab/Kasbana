name: Deploy Client Dashboard (app.stampn.net)

# Builds the standalone Client Dashboard (frontend/dashboard) on pushes to PROD
# that touch the dashboard, and publishes the static build to the
# `deployment-dashboard` branch, which Hostinger serves on app.stampn.net
# (point the subdomain's Git deploy at that branch in the Hostinger panel — that
# side is configured once, manually).
#
# Gated on `prod` (NOT dev) on purpose: the dashboard calls the backend API, so
# it must go live in lockstep with the backend (deploy-prod.yml, also on `prod`).
# Promoting dev -> prod ships both together, so the live dashboard can never run
# ahead of a backend change it depends on (e.g. a new request header + its CORS
# allowance). The path filter means backend/doc-only promotions skip the rebuild.
#
# Build-time env bakes into the bundle:
#   VITE_USE_MOCKS=0                       -> hit the real backend, not MSW
#   VITE_API_URL=https://api.stampn.net   -> API base = + "/api/v1"
#   VITE_MAPTILER_KEY=<secrets.MAPTILER_KEY> -> Locations map/geocoding (client
#     key; domain-restrict it to app.stampn.net in the MapTiler dashboard)
# The backend must allow CORS from https://app.stampn.net.
#
# Uses GITHUB_TOKEN, so the publish push does not re-trigger this workflow.

on:
  push:
    branches: [prod]
    paths: ['frontend/dashboard/**', '.github/workflows/deploy-dashboard.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json

      - name: Build dashboard
        working-directory: frontend/dashboard
        env:
          VITE_USE_MOCKS: '0'
          VITE_API_URL: https://api.stampn.net
          VITE_MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          npm ci
          npm run build

      - name: Publish build to deployment-dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deployment-dashboard
          publish_dir: ./frontend/dashboard/dist
          # Do NOT set force_orphan: true. Hostinger serves this branch via a cached
          # shallow git clone; an orphan force-push rewrites all history and
          # invalidates Hostinger's .git/shallow, failing every pull with
          # "fatal: shallow file has changed since we read it". Regular commits keep
          # a continuous history Hostinger can fetch incrementally.
          enable_jekyll: true
          commit_message: "deploy: dashboard build from prod"
