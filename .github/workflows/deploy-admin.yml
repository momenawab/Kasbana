name: Deploy Admin Console (admin.stampn.net)

# Builds the standalone platform admin console (frontend/admin) on pushes to PROD
# that touch it, and publishes the static build to the `deployment-admin` branch,
# which Hostinger serves on admin.stampn.net (point the subdomain's Git deploy at
# that branch in the Hostinger panel — configured once, manually).
#
# Gated on `prod` (NOT dev), lockstep with the backend (deploy-prod.yml): the
# console calls /api/admin/v1, so it must ship together with the backend that
# serves those endpoints. Promoting dev -> prod releases both as a matched set.
#
# Build-time env bakes into the bundle:
#   VITE_API_URL=https://api.stampn.net   -> API base = + "/api/admin/v1"
# The backend must allow CORS from https://admin.stampn.net.
#
# Uses GITHUB_TOKEN, so the publish push does not re-trigger this workflow.

on:
  push:
    branches: [prod]
    paths: ['frontend/admin/**', '.github/workflows/deploy-admin.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json

      - name: Build admin console
        working-directory: frontend/admin
        env:
          VITE_API_URL: https://api.stampn.net
        run: |
          npm ci
          npm run build

      - name: Publish build to deployment-admin
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deployment-admin
          publish_dir: ./frontend/admin/dist
          force_orphan: true
          enable_jekyll: true
          commit_message: "deploy: admin console build"
