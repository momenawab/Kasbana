name: Deploy Backend (prod)

# Production deploy, gated by the `prod` branch. Promote with:
#   git checkout prod && git merge --ff-only dev && git push origin prod
#
# Build happens in CI (the t3.small never builds): the image is pushed to GHCR,
# then the EC2 box pulls it, migrates, and rolls the stack.

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/momenawab/stampn-backend

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync infra/ to the server
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" 'mkdir -p /opt/stampn/infra'
          tar -C infra -czf - . | \
            ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" 'tar -C /opt/stampn/infra -xzf -'

      # GitHub secrets are the source of truth for credentials; this pushes them
      # into the server's .env before the stack rolls, so nobody has to hand-edit
      # it over SSH. Values go over stdin, never argv — an argument would be
      # visible in `ps` on the box while the command runs. An unset secret
      # arrives empty and is SKIPPED, so adding one secret can't blank the rest.
      - name: Sync secrets into the server .env
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ secrets.WHATSAPP_BUSINESS_ACCOUNT_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
        run: |
          {
            printf 'WHATSAPP_ACCESS_TOKEN=%s\n'        "$WHATSAPP_ACCESS_TOKEN"
            printf 'WHATSAPP_PHONE_NUMBER_ID=%s\n'     "$WHATSAPP_PHONE_NUMBER_ID"
            printf 'WHATSAPP_BUSINESS_ACCOUNT_ID=%s\n' "$WHATSAPP_BUSINESS_ACCOUNT_ID"
            printf 'WHATSAPP_APP_SECRET=%s\n'          "$WHATSAPP_APP_SECRET"
            printf 'WHATSAPP_VERIFY_TOKEN=%s\n'        "$WHATSAPP_VERIFY_TOKEN"
          } | ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
                'cd /opt/stampn/infra && bash scripts/upsert_env.sh'

      - name: Deploy on the server
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            "set -e; \
             echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin; \
             cd /opt/stampn/infra; \
             IMAGE_TAG='$IMAGE_TAG' bash scripts/deploy.sh"
