    <!-- Apply the saved light/dark theme before the bundle paints (no flash). -->

      (function () {
        try {
          var t = localStorage.getItem('stampn_theme')
          if (t === 'dark') {
            document.documentElement.classList.add('dark')

            if (m) m.setAttribute('content', '#0F0D18')
          }
        } catch (e) {}
      })()
